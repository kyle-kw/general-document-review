[project]
name = "general-document-review-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite>=0.21,<1",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
  "rq>=2.2,<3",
  "redis>=5,<7",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "openai-codex==0.162.1",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1,<2",
  "pdfplumber>=0.11,<1",
  "pypdf>=5,<7",
  "lxml>=5,<7",
  "mcp==2.3.0",
  "json-repair==0.64.0",
  "jsonschema>=4.26,<5",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "fakeredis[lua]>=2.31,<3", "respx>=0.22,<1", "reportlab>=4,<5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
